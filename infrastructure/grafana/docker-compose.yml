services:
  grafana:
    image: grafana/grafana:latest
    container_name: graphcat-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
networks:
  default:
    name: graphcat
    external: true
