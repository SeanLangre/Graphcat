apiVersion: 1

groups:
  - orgId: 1
    name: logstream
    folder: LogStream
    interval: 1m
    rules:
      - uid: logstream-error-spike
        title: Error spike per app
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: afz08sm46ot8gd
            model:
              refId: A
              expr: sum by (app, device_id) (count_over_time({job="logstream", level=~"error|critical"}[5m]))
              queryType: instant
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [50]
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.app }} on {{ $labels.device_id }} logged {{ $values.B }} errors in the last 5 minutes'
